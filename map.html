<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TezMoon Simulator">
  <title>Chad Map</title>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/highcharts-more.js"></script>
  <script src="https://code.highcharts.com/modules/boost.js"></script>
  <script src="https://code.highcharts.com/modules/exporting.js"></script>
  <script src="https://code.highcharts.com/modules/export-data.js"></script>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    @import url("https://fonts.googleapis.com/css?family=Monda:400,500,600");
    html, body {
      height: 100%;
      margin: 0;
    }

    /* Original TezCool Header */
    .header {
      height: 80px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: 0 0;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.26);
      padding: 16px 24px;
      z-index: 100;
      transition: .3s;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .header-content {
      display: flex;
      align-items: center;
      width: 100%;
      justify-content: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .nav-menu {
      align-items: center;
      display: flex;
      gap: 24px;
      list-style: none;
      margin: 0;
      padding: 0;
      justify-content: center;
    }

    .nav-item {
      color: #ffffff;
      font-family: "Monda", Helvetica, sans-serif;
      font-size: 1rem;
      font-weight: 400;
      padding: 8px 16px;
      border-radius: 16px;
      transition: .3s;
      cursor: pointer;
      position: relative;
      text-decoration: none;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.01);
      color: #a27cee;
    }

    .nav-item.active {
      background: linear-gradient(180deg, rgba(162, 124, 238, 1) 0%, rgba(127, 75, 231, 1) 100%);
      color: #ffffff;
    }

    @media (max-width: 1200px) {
      .nav-menu {
        gap: 16px;
      }

      .nav-item {
        font-size: 0.9rem;
        padding: 6px 12px;
      }
    }

    @media (max-width: 1024px) {
      .nav-menu {
        gap: 12px;
      }

      .nav-item {
        font-size: 0.85rem;
        padding: 6px 10px;
      }
    }

    @media (max-width: 768px) {
      .header {
        padding: 12px 16px;
      }

      .nav-menu {
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .nav-item {
        font-size: 0.8rem;
        padding: 4px 8px;
      }
    }

    @media (max-width: 640px) {
      .header {
        height: 130px;
        padding: 10px 12px;
      }

      .nav-menu {
        gap: 6px;
      }

      .nav-item {
        font-size: 0.75rem;
        padding: 4px 6px;
        border-radius: 12px;
      }
    }

    @media (max-width: 480px) {
      .header {
        padding: 8px 10px;
      }

      .nav-menu {
        gap: 4px;
      }

      .nav-item {
        font-size: 0.7rem;
        padding: 3px 5px;
        border-radius: 10px;
      }
    }

    .container {
      height: 100%;
      padding-top: 100px;
    }

    .row, .col-lg-12, .highcharts-figure {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #chadmap {
      font-family: "Monda", Helvetica;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 640px) {
      .container {
        padding-top: 130px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding-top: 150px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-content">
      <nav class="nav-menu">
        <a href="https://tez.cool/" class="nav-item">HOME</a>
        <a href="https://up.tez.cool/" class="nav-item">TEZCALM</a>
        <a href="https://tez.cool/map?q=20000" class="nav-item active">CHADMAP</a>
        <a href="https://eye.tez.cool/" class="nav-item">THE EYE OF CHAD</a>
        <a href="https://stake.tez.cool/" class="nav-item">TEZSTAKE</a>
        <a href="https://trollbox.tez.cool/" class="nav-item">TEZTROLLBOX</a>
        <a href="https://secret.tez.cool/" class="nav-item">TEZWHALES</a>
        <a href="https://chat.tez.cool/" class="nav-item">NFTCHAT</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <figure class="highcharts-figure">
          <div id="chadmap"></div>
        </figure>
      </div>
    </div>
  </div>
  <script>
  Highcharts.setOptions({
    chart: {
        style: {
            fontFamily: '"Monda", Helvetica, Arial, sans-serif'
        }
    },
    title: {
        style: {
            fontFamily: '"Monda", Helvetica, Arial, sans-serif'
        }
    },
    subtitle: {
        style: {
            fontFamily: '"Monda", Helvetica, Arial, sans-serif'
        }
    },
    xAxis: {
        labels: {
            style: {
                fontFamily: '"Monda", Helvetica, Arial, sans-serif'
            }
        },
        title: {
            style: {
                fontFamily: '"Monda", Helvetica, Arial, sans-serif'
            }
        }
    },
    yAxis: {
        labels: {
            style: {
                fontFamily: '"Monda", Helvetica, Arial, sans-serif'
            }
        },
        title: {
            style: {
                fontFamily: '"Monda", Helvetica, Arial, sans-serif'
            }
        }
    },
    legend: {
        itemStyle: {
            fontFamily: '"Monda", Helvetica, Arial, sans-serif'
        }
    },
    tooltip: {
        style: {
            fontFamily: '"Monda", Helvetica, Arial, sans-serif'
        }
    },
    plotoptions: {
        series: {
            dataLabels: {
                style: {
                    fontFamily: '"Monda", Helvetica, Arial, sans-serif'
                }
            }
        }
    }
});
    document.addEventListener('DOMContentLoaded', function () {
      function fetchData(url) {
        return fetch(url).then(response => response.json());
      }

      function escapeHTML(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function processAccountData(data) {
        let q = Math.abs(parseInt(new URLSearchParams(window.location.search).get('q'), 10));
        return data.filter(account => (account.stakedBalance || 0) >= (isNaN(q) ? 1000000000 : q*1000000)).map(account => {
          const name = escapeHTML(account.alias ? account.alias : account.address);
          const stakedBalance = account.stakedBalance || 0;
          const address = account.address;
          return {
            name: name,
            value: stakedBalance / 1e6,
            stakedBalance: stakedBalance,
            display: name + ': ' + (stakedBalance / 1e6).toLocaleString() + ' XTZ',
            address: address,
            marker: {
              symbol: `url(https://services.tzkt.io/v1/avatars/${encodeURIComponent(address)})`
            }
          };
        });
      }

      function initChart(processedData) {
        Highcharts.chart('chadmap', {
          navigation: {
            buttonOptions: {
              enabled: false
            }
          },
          chart: {
            type: 'packedbubble',
            backgroundColor: 'rgba(0,0,0,0)',
            boost: {
              useGPUTranslations: true,
              usePreAllocated: true
            },
            events: {
              load: function() {
                const chart = this;
                setTimeout(() => {
                  chart.series[0].points.forEach(point => {
                    const image = point.graphic.element;
                    image.style.clipPath = 'circle(50%)';
                    image.style.webkitClipPath = 'circle(50%)';
                  });
                }, 500);
              }
            }
          },
          title: {
            text: 'Stake 20 000 XTZ or more to join a Chad Club!',
            style: {
              color: '#ffffff'
            }
          },
          tooltip: {
            useHTML: true,
            pointFormat: '<b>{point.display}</b>'
          },
          plotOptions: {
            packedbubble: {
              boostThreshold: 1,
              minSize: '100%',
              maxSize: '100%',
              zMin: 0,
              zMax: Math.max(...processedData.map(d => d.value)),
              colorByPoint: true,
              layoutAlgorithm: {
                maxIterations: 500,
                gravitationalConstant: 0.005,
                splitSeries: false,
                seriesInteraction: true,
                dragBetweenSeries: true,
                parentNodeLimit: true
              },
              dataLabels: {
                enabled: false
              },
              states: {
                hover: {
                  enabled: false,
                  halo: {
                    size: 0
                  }
                }
              },
              events: {
                click: function (event) {
                  const address = event.point.options.address;
                  window.open(`https://tzkt.io/${address}`, '_blank');
                }
              }
            }
          },
          colorAxis: {
            min: 0,
            max: Math.max(...processedData.map(d => d.value)),
            stops: [
              [0, '#00f2f2'],
              [0.5, '#00d0d0'],
              [1, '#007777']
            ],
            minColor: '#00f2f2',
            maxColor: '#007777'
          },
          series: [{
            name: 'Chad Energy',
            data: processedData
          }],
          legend: {
            enabled: false
          },
          responsive: {
            rules: [{
              condition: {},
              chartOptions: {
                plotOptions: {
                  packedbubble: {
                    minSize: '100%',
                    maxSize: '200%'
                  }
                }
              }
            }]
          },
          credits: {
            enabled: false
          }
        });
      }

      Promise.all([
        fetchData('https://api.tzkt.io/v1/accounts?stakedPseudotokens.gt=0&limit=10000'),
        fetchData('https://api.tzkt.io/v1/delegates?active=true&limit=10000')
      ]).then(results => {
        const accountData = processAccountData(results[0]);
        const delegateData = processAccountData(results[1]);
        const combinedData = [...accountData, ...delegateData];

        initChart(combinedData);
      }).catch(error => console.error('Error fetching data:', error));
    });
  </script>
</body>

</html>
